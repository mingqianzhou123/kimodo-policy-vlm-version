main:
  task: null
  data_root: cross_tracker/data/cache/prepared-v1/train
  text_cache: cross_tracker/data/cache/text
  save_root: cross_tracker/runs
  max_steps: 2000
  stop_after: null
  batch_size: 8
  micro_batch_size: 2
  action_chunk: 50
  action_history: 100
  seed: 42
  sampling: episodes
  dtype: bf16
  num_workers: 2
  log_every: 10
  checkpoint_every: 500
  final_checkpoints: 1
  final_checkpoint_spacing: 1000
  score_checkpoints: null
  gradient:
    grad_clip_norm: 1.0
    hand_grad_clip_norm: 1.0
model:
  cameras:
  - head
  fps: 30
  motion_mask_mode: concat
  dinov3_model_name: dinov3-vitl16-pretrain-lvd1689m
  dinov3_checkpoint: null
  text_feature_dim: 4096
  controlnet_num_layers: 4
  controlnet_scale: 1
  detach_root_control_for_body: true
  control_fusion_mode: both
  enable_hand_head: true
  hand_hidden_dim: 256
  hand_num_layers: 4
  hand_num_heads: 4
  hand_ffn_dim: 1024
  hand_init_seed: 3407
  hand_control_mode: binary
training:
  ema_decays: []
  spike_skip:
    factor: null
    window: 200
    max_consecutive: 10
  augmentation:
    image_shift: 0
    proprio_mask_prob: 0.0
  loss:
    motion_loss_type: mse
    mse_weights:
      root: 4.0
      body: 1.0
      hand: 1.0
      hand_transition: 0.2
  optimizer:
    control_backbone_lr: 3.0e-05
    control_adapter_lr: 0.0001
    hand_lr: 0.0001
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    warmup_steps: 100
    min_lr_ratio: 0.1
initialization:
  checkpoint: /root/workspace/humanoidVLA/cross_tracker/data/cache/weights/Pre_Train/pt_419h_gbs1024_100w_controlnet4_detach_true_mse/2026-08-26_17-06-35/checkpoint_1000000
