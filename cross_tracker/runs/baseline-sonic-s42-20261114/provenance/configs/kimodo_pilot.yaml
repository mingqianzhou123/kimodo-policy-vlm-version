# Short validation only. All paths stay under cross_tracker; no BiGym run reuse.
_base_: ../../configs/bigym2.yaml
main:
  data_root: cross_tracker/data/cache/prepared-v1/train
  text_cache: cross_tracker/data/cache/text
  save_root: cross_tracker/runs
  max_steps: 2000
  batch_size: 8
  micro_batch_size: 2
  action_chunk: 50
  action_history: 100
  seed: 42
  sampling: episodes
  num_workers: 2
  log_every: 10
  checkpoint_every: 500
  final_checkpoints: 1
model:
  cameras: [head]
training:
  scheduler:
    warmup_steps: 100
