<svg xmlns="http://www.w3.org/2000/svg" width="855" height="280" font-family="sans-serif" font-size="11">
<rect width="100%" height="100%" fill="white"/>
<text x="10" y="18" font-size="13">锤子：锁存后注入错位，第一轮成功率（每点 20 回合；虚线是零档的一半）</text>
<rect x="45" y="40" width="230" height="170" fill="none" stroke="#999"/>
<text x="40" y="214.0" text-anchor="end">0%</text>
<text x="40" y="129.0" text-anchor="end">50%</text>
<text x="40" y="44.0" text-anchor="end">100%</text>
<line x1="45" x2="275" y1="129.2" y2="129.2" stroke="#888" stroke-dasharray="4 3"/>
<polyline fill="none" stroke="#1565c0" stroke-width="2" points="45.0,125.0 102.5,48.5 160.0,48.5 217.5,40.0 275.0,40.0"/>
<circle cx="45.0" cy="125.0" r="3.5" fill="#1565c0"/>
<text x="45.0" y="225" text-anchor="middle">-10</text>
<circle cx="102.5" cy="48.5" r="3.5" fill="#1565c0"/>
<text x="102.5" y="225" text-anchor="middle">-5</text>
<circle cx="160.0" cy="48.5" r="3.5" fill="#1565c0"/>
<text x="160.0" y="225" text-anchor="middle">+0</text>
<circle cx="217.5" cy="40.0" r="3.5" fill="#1565c0"/>
<text x="217.5" y="225" text-anchor="middle">+5</text>
<circle cx="275.0" cy="40.0" r="3.5" fill="#1565c0"/>
<text x="275.0" y="225" text-anchor="middle">+10</text>
<text x="160.0" y="243" text-anchor="middle">沿锤柄 (cm)</text>
<rect x="320" y="40" width="230" height="170" fill="none" stroke="#999"/>
<text x="315" y="214.0" text-anchor="end">0%</text>
<text x="315" y="129.0" text-anchor="end">50%</text>
<text x="315" y="44.0" text-anchor="end">100%</text>
<line x1="320" x2="550" y1="129.2" y2="129.2" stroke="#888" stroke-dasharray="4 3"/>
<polyline fill="none" stroke="#1565c0" stroke-width="2" points="320.0,40.0 389.0,48.5 435.0,48.5 481.0,57.0 550.0,210.0"/>
<circle cx="320.0" cy="40.0" r="3.5" fill="#1565c0"/>
<text x="320.0" y="225" text-anchor="middle">-5</text>
<circle cx="389.0" cy="48.5" r="3.5" fill="#1565c0"/>
<text x="389.0" y="225" text-anchor="middle">-2</text>
<circle cx="435.0" cy="48.5" r="3.5" fill="#1565c0"/>
<text x="435.0" y="225" text-anchor="middle">+0</text>
<circle cx="481.0" cy="57.0" r="3.5" fill="#1565c0"/>
<text x="481.0" y="225" text-anchor="middle">+2</text>
<circle cx="550.0" cy="210.0" r="3.5" fill="#1565c0"/>
<text x="550.0" y="225" text-anchor="middle">+5</text>
<text x="435.0" y="243" text-anchor="middle">垂直锤柄 (cm，正=远离机器人)</text>
<rect x="595" y="40" width="230" height="170" fill="none" stroke="#999"/>
<text x="590" y="214.0" text-anchor="end">0%</text>
<text x="590" y="129.0" text-anchor="end">50%</text>
<text x="590" y="44.0" text-anchor="end">100%</text>
<line x1="595" x2="825" y1="129.2" y2="129.2" stroke="#888" stroke-dasharray="4 3"/>
<polyline fill="none" stroke="#1565c0" stroke-width="2" points="595.0,167.5 652.5,65.5 710.0,48.5 767.5,48.5 825.0,91.0"/>
<circle cx="595.0" cy="167.5" r="3.5" fill="#1565c0"/>
<text x="595.0" y="225" text-anchor="middle">-40</text>
<circle cx="652.5" cy="65.5" r="3.5" fill="#1565c0"/>
<text x="652.5" y="225" text-anchor="middle">-20</text>
<circle cx="710.0" cy="48.5" r="3.5" fill="#1565c0"/>
<text x="710.0" y="225" text-anchor="middle">+0</text>
<circle cx="767.5" cy="48.5" r="3.5" fill="#1565c0"/>
<text x="767.5" y="225" text-anchor="middle">+20</text>
<circle cx="825.0" cy="91.0" r="3.5" fill="#1565c0"/>
<text x="825.0" y="225" text-anchor="middle">+40</text>
<text x="710.0" y="243" text-anchor="middle">转动 (°，逆时针为正)</text>
<text x="45" y="270">箱子对照：左右错位 3 cm 以内一轮成功约 85%，3–5 cm 61%，5–8 cm 42%（往复运动，按合手时位移分档）</text>
</svg>