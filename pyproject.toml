[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo-vla"
version = "0.1.0"
description = "Kimodo-Policy with a benchmark-agnostic agent and thin benchmark adapters"
requires-python = ">=3.10,<3.13"
# Versions follow the environment the released Kimodo-Policy checkpoints were trained in.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.4",
    "einops>=0.8",
    "omegaconf>=2.3",
    "pydantic>=2",
    "safetensors>=0.4",
    "transformers>=4.43",
    "peft>=0.12",
    "tqdm",
]

[project.optional-dependencies]
# BiGym 2.0 pins mujoco<3.9; nothing in kimodo_vla itself imports mujoco.
bigym2 = ["bigym @ git+https://github.com/swirl-uk/BiGym2.git"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kimodo_vla*"]

[tool.setuptools.package-data]
"kimodo_vla.skeleton" = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
