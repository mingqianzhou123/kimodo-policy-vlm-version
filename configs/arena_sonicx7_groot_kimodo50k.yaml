_base_: arena_sonicx7_groot_stable.yaml

main:
  batch_size: 64
  micro_batch_size: 32
  max_steps: 50000
  reset_optimizer: true
  extra_checkpoints: [1000, 5000, 10000, 25000]
  score_checkpoints: [50000]
  save_root: log/arena_sonicx7_groot

model:
  compile: false
  kimodo_unfreeze_layers: 2

training:
  stages:
    adapter_start: 1
    initial_stage: kimodo
    vision_start: null
  optimizer:
    kimodo_lr: 2.0e-6
    control_adapter_lr: 5.0e-6
    hand_lr: 5.0e-6
    vl_adapter_lr: 2.0e-6
  scheduler:
    warmup_steps: 3000
    adapter_warmup_steps: 1000
